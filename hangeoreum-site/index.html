<html lang="ko">

  <meta name="color-scheme" content="light">

  <style>

    .route-line { color: #95a1b5; font-size: 11px; }
    .result-bottom { color: var(--muted); font-size: 10px; }

    .seat-grid { width: min(100%, 278px); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 17px 1fr 1fr; gap: 7px 5px; }
    .seat { min-width: 0; height: 35px; border: 1px solid #cfe0f9; border-radius: 9px; background: white; color: #3c5a80; font-size: 10px; font-weight: 800; }
    .seat.selected { border-color: var(--blue); background: var(--blue); color: white; box-shadow: 0 3px 8px rgb(40 120 240 / 25%); }
    .seat.booked { border-color: #e2e5eb; background: #e9ecf1; color: #a1a9b5; cursor: not-allowed; text-decoration: line-through; }
    .aisle { display: grid; place-items: center; color: #adb7c7; font-size: 9px; }
    .seat-legend { display: flex; justify-content: center; gap: 13px; flex-wrap: wrap; margin-top: 14px; color: #67748a; font-size: 10px; }

    .legend-box { width: 12px; height: 12px; border: 1px solid #cfe0f9; border-radius: 4px; background: white; }
    .legend-box.chosen { border-color: var(--blue); background: var(--blue); }

    .selection-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; font-size: 12px; }
    .selection-row strong { color: var(--blue-dark); }
    .fare-row { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .fare-row:last-child { border-bottom: 0; }
    .fare-row.total { padding-top: 14px; color: var(--ink); font-size: 14px; font-weight: 900; }
    .success-mark { width: 60px; height: 60px; margin: 0 auto 13px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--green); font-size: 30px; }
    .success-card { padding: 25px 17px; text-align: center; }
    .success-card h2 { margin-bottom: 7px; }
    .success-card .muted { font-size: 12px; line-height: 1.6; }
    .ticket-code { margin: 17px auto 0; padding: 11px; border-radius: 11px; color: #53617a; background: #f3f6fa; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; letter-spacing: .4px; }
    .taxi-map { min-height: 155px; margin-bottom: 14px; overflow: hidden; position: relative; border-radius: 17px; background: linear-gradient(135deg, #e5f1ff, #eef5ff); border: 1px solid #dfeaf9; }
    .taxi-map:before, .taxi-map:after { content: ""; position: absolute; width: 150%; height: 17px; left: -20%; top: 52px; border: 6px solid white; border-left: 0; border-right: 0; border-radius: 50%; transform: rotate(-17deg); }
    .taxi-map:after { top: 102px; transform: rotate(20deg); }
    .map-pin { position: absolute; z-index: 1; left: 22%; top: 34px; font-size: 23px; }

    .vehicle small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }

  </style>
</head>
<body>
  <div class="app">

  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <datalist id="stationOptions"></datalist>
  <script>

      const taxi = state.taxi;
      if (taxi.stage === "done" && taxi.booking) {
        $("#taxiPage").innerHTML = `<div class="back-row"><button class="back" data-action="new-taxi" aria-label="새 호출">←</button><div><h1>호출 시뮬레이션 완료</h1><p>택시 이동 체험이 기록되었습니다.</p></div></div><div class="card success-card"><div class="success-mark">✓</div><h2>차량을 요청했어요</h2><p class="muted">실제 차량이 호출되거나 요금이 결제되지 않았습니다.</p><div class="ticket-code">${escapeHtml(taxi.booking.id)}</div></div><div class="card" style="margin-top:12px"><div class="booking-route">🚕 ${escapeHtml(taxi.booking.from)} → ${escapeHtml(taxi.booking.to)}</div><div class="booking-meta">${escapeHtml(taxi.booking.vehicleName)} · 예상 ${taxi.booking.duration}분<br>가상 예상 요금 ${won(taxi.booking.total)}</div></div><button class="primary wide" data-nav="bookings">이용 기록 확인</button><button class="outline wide" data-nav="home">홈으로</button>`;
        return;
      }
      const quote = taxiQuote(taxi.from, taxi.to, taxi.vehicle);
      const vehicles = [{ id: "standard", icon: "🚕", name: "일반택시", desc: "편안한 기본 이동" }, { id: "premium", icon: "🚖", name: "모범택시", desc: "여유로운 프리미엄" }];
      $("#taxiPage").innerHTML = `<div class="back-row"><button class="back" data-nav="home" aria-label="홈으로">←</button><div><h1>택시 호출</h1><p>목적지를 입력하고 예상 요금을 확인해요.</p></div></div>
        <div class="taxi-map" aria-label="경로 미리보기"><span class="map-pin">📍</span><span class="map-pin end">🏁</span><span class="map-label">가상 경로 안내</span></div>
        <div class="card"><div class="field"><label for="taxiFrom">출발지</label><input id="taxiFrom" list="stationOptions" value="${escapeHtml(taxi.from)}" placeholder="출발지를 입력해 주세요"></div><button class="location-button wide" data-action="nearby-taxi">⌖ 현재 위치 사용</button><div class="field"><label for="taxiTo">도착지</label><input id="taxiTo" list="stationOptions" value="${escapeHtml(taxi.to)}" placeholder="목적지를 검색해 주세요"></div></div>
        <div class="section-heading"><h2>차량 유형</h2></div><div class="vehicle-grid">${vehicles.map(item => `<button class="vehicle${taxi.vehicle === item.id ? " active" : ""}" data-action="taxi-vehicle" data-vehicle="${item.id}"><span class="vehicle-icon">${item.icon}</span><strong>${item.name}</strong><small>${item.desc}</small></button>`).join("")}</div>
        <div class="quote" id="taxiQuote"><span>예상 이동 ${quote.duration}분</span><strong>약 ${won(quote.fare)}</strong></div><p class="demo-caption">출발지와 도착지를 입력하면 예상 정보가 자동으로 바뀌어요.</p>
        <button class="primary wide" id="taxiCallButton" data-action="call-taxi" ${!taxi.from.trim() || !taxi.to.trim() ? "disabled" : ""}>가상 호출하기</button>
        <p class="demo-caption">거리, 시간, 요금은 입력한 장소에 따라 계산되는 임의의 시연 값입니다. 지도·차량 호출 API와 연결되어 있지 않습니다.</p>`;
    }
    function taxiQuote(from, to, vehicle) {
      const text = `${from}${to}`;
      const seed = Array.from(text).reduce((sum, char) => sum + char.codePointAt(0), 0);
      const km = 5 + seed % 24;
      const fare = (4800 + km * 950 + (vehicle === "premium" ? 6000 : 0));
      return { duration: Math.round(km * 2.8 + 5), fare: Math.round(fare / 100) * 100 };
    }
    function renderBookings() {
      const items = [...state.bookings].reverse();
      $("#bookingsPage").innerHTML = `<div class="back-row"><div><h1>예약 내역</h1><p>기차·버스 예약과 택시 호출 기록</p></div></div>
        ${items.length ? `<div class="booking-list">${items.map((item, index) => `<article class="booking-card${item.status === "cancelled" ? " cancelled" : ""}"><div class="booking-head"><strong>${serviceIcon(item.type)} ${escapeHtml(serviceName(item.type))} ${item.type === "taxi" ? "호출" : "예약"}</strong><span class="status${item.status === "cancelled" ? " cancelled" : ""}">${item.status === "cancelled" ? "취소됨 · 시뮬레이션" : "가상 예약"}</span></div>
          <div class="booking-route">${escapeHtml(item.from)} <span class="arrow">→</span> ${escapeHtml(item.to)}</div>
          <div class="booking-meta">${escapeHtml(formatDate(item.date))} · ${escapeHtml(item.time || "호출 기록")}<br>${escapeHtml(item.schedule || item.vehicleName || "택시 호출")} · ${item.passengers || 1}명${item.seats && item.seats.length ? ` · 좌석 ${escapeHtml(item.seats.join(", "))}` : ""}<br>${won(item.total)} · ${escapeHtml(item.id)}</div>
          ${item.status !== "cancelled" ? `<div class="booking-actions"><button class="danger" data-action="cancel-booking" data-index="${state.bookings.length - 1 - index}">가상 예약 취소</button></div>` : ""}</article>`).join("")}</div>` : `<div class="card empty">아직 예약 내역이 없어요.<br>기차나 버스 좌석을 골라 예약 체험을 시작해 보세요.<br><button class="primary" style="margin-top:15px" data-nav="train">기차 검색</button></div>`}
        <div class="notice">내역은 이 브라우저에만 저장되는 시연 데이터입니다. 취소해도 실제 예약에는 영향이 없습니다.</div>`;
    }
    function renderProfile() {
      const active = state.bookings.filter(item => item.status !== "cancelled");
      const routes = ["train", "bus", "taxi"].map(type => active.filter(item => item.type === type).length);
      const favoriteRows = state.favorites.map((item, index) => `<div class="favorite"><span><strong>${escapeHtml(item.from)} <span class="arrow">→</span> ${escapeHtml(item.to)}</strong><small>${escapeHtml(serviceName(item.type))} · 즐겨찾는 경로</small></span><button class="danger" style="min-height:34px;padding:0 10px;border-radius:9px;font-size:10px" data-action="remove-favorite" data-index="${index}">삭제</button></div>`).join("");
      $("#profilePage").innerHTML = `<div class="back-row"><div><h1>마이페이지</h1><p>내 이동 기록과 즐겨찾는 경로를 관리해요.</p></div></div>
        <div class="profile-card"><div class="avatar">🙂</div><div><strong>${escapeHtml(state.profile.name)}</strong><small>SMART RESERVE 이용자</small></div></div>
        <div class="section-heading"><h2>이용 통계</h2></div><div class="stats-grid"><div class="stat"><strong>${routes[0]}</strong><small>기차 예약</small></div><div class="stat"><strong>${routes[1]}</strong><small>버스 예약</small></div><div class="stat"><strong>${routes[2]}</strong><small>택시 호출</small></div></div>
        <div class="section-heading"><h2>프로필</h2></div><div class="card"><div class="field"><label for="profileName">표시 이름</label><input id="profileName" maxlength="24" value="${escapeHtml(state.profile.name)}" placeholder="이름을 입력해 주세요"></div><button class="secondary wide" style="margin-top:4px" data-action="save-profile">이름 저장</button></div>
        <div class="section-heading"><h2>즐겨찾는 경로</h2></div><div class="favorite-list">${favoriteRows || `<div class="card empty">저장된 경로가 없습니다.</div>`}</div>
        <div class="section-heading"><h2>경로 추가</h2></div><div class="card favorite-form"><div class="field"><label for="favoriteType">이동 수단</label><select id="favoriteType"><option value="train">기차</option><option value="bus">버스</option></select></div><div class="field"><label for="favoriteFrom">출발지</label><input id="favoriteFrom" list="stationOptions" placeholder="출발역 또는 터미널"></div><div class="field"><label for="favoriteTo">도착지</label><input id="favoriteTo" list="stationOptions" placeholder="도착역 또는 터미널"></div><button class="primary" data-action="add-favorite">즐겨찾기에 추가</button></div>
        <div class="notice">프로필, 즐겨찾기 및 시연 내역은 브라우저의 로컬 저장소에 보관됩니다. 다른 기기와 공유되지는 않습니다.</div>`;
    }
    function readSearchInputs(home) {
      const from = $(`#${home ? "homeFrom" : "searchFrom"}`);
      const to = $(`#${home ? "homeTo" : "searchTo"}`);
      const date = $(`#${home ? "homeDate" : "searchDate"}`);
      if (!from || !to || !date) return false;
      state.draft.from = from.value.trim();
      state.draft.to = to.value.trim();
      state.draft.date = date.value;
      if (!state.draft.from || !state.draft.to) { toast("출발지와 도착지를 모두 입력해 주세요."); return false; }
      if (state.draft.from.toLocaleLowerCase() === state.draft.to.toLocaleLowerCase()) { toast("출발지와 도착지를 다르게 선택해 주세요."); return false; }
      if (!state.draft.date || state.draft.date < localDate) { toast("오늘 이후 날짜를 선택해 주세요."); return false; }
      return true;
    }
    function performSearch(home) {
      if (!readSearchInputs(home)) return;
      const source = state.draft.type === "train" ? trainSchedules : busSchedules;
      const offset = (state.draft.from.length + state.draft.to.length) % source.length;
      state.results = source.map((_, index) => source[(index + offset) % source.length]).map((item, index) => ({ ...item, index }));
      state.stage = "results";
      if (home) showPage("search"); else renderSearch();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function selectSchedule(index) {
      const schedule = state.results.find(item => item.index === Number(index));
      if (!schedule) { toast("운행편 정보를 찾지 못했습니다. 다시 검색해 주세요."); return; }
      state.schedule = schedule;
      state.seatClass = "standard";
      state.seats = [];
      state.stage = "seats";
      renderSearch();
    }
    function toggleSeat(number) {
      const type = state.draft.type === "bus" ? "bus" : state.seatClass;
      if (bookedSeats[type].includes(number)) return;
      if (state.seats.includes(number)) state.seats = state.seats.filter(seat => seat !== number);
      else if (state.seats.length >= state.draft.passengers) toast(`선택 인원 ${state.draft.passengers}명에 맞춰 좌석을 선택해 주세요.`);
      else state.seats = [...state.seats, number];
      renderSearch();
    }
    function bookingRecord(type, from, to, date, time, schedule, seats, passengers, total, vehicleName = "") {
      return { id: `SR-${Date.now().toString(36).toUpperCase()}`, type, from, to, date, time, schedule, seats, passengers, total, vehicleName, status: "confirmed", createdAt: new Date().toISOString() };
    }
    function completeReservation() {
      if (!state.schedule || state.seats.length !== state.draft.passengers) { toast("인원수만큼 좌석을 먼저 선택해 주세요."); return; }
      const unit = state.draft.type === "bus" ? state.schedule.fare : state.seatClass === "premium" ? state.schedule.premium : state.schedule.fare;
      const record = bookingRecord(state.draft.type, state.draft.from, state.draft.to, state.draft.date, state.schedule.depart, `${state.schedule.name} · ${state.draft.type === "train" ? state.seatClass === "premium" ? "특실" : "일반실" : state.schedule.badge}`, [...state.seats], state.draft.passengers, unit * state.seats.length);
      state.bookings.push(record);
      state.lastBooking = record;
      state.stage = "done";
      persist();
      renderSearch();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function startSearch(type) {
      state.draft.type = type;
      state.stage = "form";
      state.seats = [];
      showPage("search");
    }
    function adjustPassengers(delta) {
      state.draft.passengers = Math.max(1, Math.min(4, state.draft.passengers + delta));
      if (state.seats.length > state.draft.passengers) state.seats = state.seats.slice(0, state.draft.passengers);
      if (state.page === "home") renderHome(); else renderSearch();
    }
    function useNearby() {
      const input = $("#homeFrom");
      if (input) input.value = "서울역";
      state.draft.from = "서울역";
      toast("시연을 위해 서울역을 출발지로 설정했어요.");
    }
    function useFavorite(index) {
      const route = state.favorites[Number(index)];
      if (!route) return;
      state.draft = { ...state.draft, type: route.type, from: route.from, to: route.to, date: localDate };
      startSearch(route.type);
    }
    function callTaxi() {
      const from = $("#taxiFrom").value.trim();
      const to = $("#taxiTo").value.trim();
      if (!from || !to) { toast("출발지와 도착지를 입력해 주세요."); return; }
      if (from === to) { toast("출발지와 도착지를 다르게 입력해 주세요."); return; }
      state.taxi.from = from;
      state.taxi.to = to;
      const quote = taxiQuote(from, to, state.taxi.vehicle);
      const vehicleName = state.taxi.vehicle === "premium" ? "모범택시" : "일반택시";
      const record = bookingRecord("taxi", from, to, localDate, "호출 시뮬레이션", "택시 이동", [], 1, quote.fare, vehicleName);
      record.duration = quote.duration;
      state.bookings.push(record);
      state.taxi.booking = record;
      state.taxi.stage = "done";
      persist();
      renderTaxi();
    }
    function handleAction(button) {
      const action = button.dataset.action;
      if (action === "swap-route") {
        const prefix = button.dataset.home === "true" ? "home" : "search";
        const from = $(`#${prefix}From`);
        const to = $(`#${prefix}To`);
        [from.value, to.value] = [to.value, from.value];
        [state.draft.from, state.draft.to] = [to.value, from.value];
      } else if (action === "passenger") {
        adjustPassengers(Number(button.dataset.delta));
      } else if (action === "search-routes") {
        state.draft.type = button.dataset.type;
        performSearch(button.dataset.home === "true");
      } else if (action === "nearby") {
        useNearby();
      } else if (action === "nearby-taxi") {
        state.taxi.from = "서울역";
        renderTaxi();
        toast("시연을 위해 서울역을 출발지로 설정했어요.");
      } else if (action === "use-favorite") {
        useFavorite(button.dataset.index);
      } else if (action === "edit-search") {
        state.stage = "form";
        renderSearch();
      } else if (action === "choose-schedule") {
        selectSchedule(button.dataset.index);
      } else if (action === "edit-results") {
        state.stage = "results";
        renderSearch();
      } else if (action === "seat-class") {
        if (state.seatClass !== button.dataset.class) {
          state.seatClass = button.dataset.class;
          state.seats = [];
          renderSearch();
        }
      } else if (action === "toggle-seat") {
        toggleSeat(button.dataset.seat);
      } else if (action === "review-reservation") {
        if (state.seats.length !== state.draft.passengers) { toast("인원수만큼 좌석을 선택해 주세요."); return; }
        state.stage = "confirm";
        renderSearch();
      } else if (action === "edit-seats") {
        state.stage = "seats";
        renderSearch();
      } else if (action === "confirm-reservation") {
        completeReservation();
      } else if (action === "taxi-vehicle") {
        state.taxi.vehicle = button.dataset.vehicle;
        state.taxi.from = $("#taxiFrom")?.value.trim() || state.taxi.from;
        state.taxi.to = $("#taxiTo")?.value.trim() || state.taxi.to;
        renderTaxi();
      } else if (action === "call-taxi") {
        callTaxi();
      } else if (action === "new-taxi") {
        state.taxi.stage = "form";
        state.taxi.booking = null;
        renderTaxi();
      } else if (action === "cancel-booking") {
        const item = state.bookings[Number(button.dataset.index)];
        if (!item || item.status === "cancelled") return;
        item.status = "cancelled";
        persist();
        render();
        toast("가상 예약을 취소했습니다.");
      } else if (action === "save-profile") {
        const name = $("#profileName").value.trim();
        if (!name) { toast("이름을 입력해 주세요."); return; }
        state.profile.name = name;
        persist();
        render();
        toast("프로필을 저장했습니다.");
      } else if (action === "add-favorite") {
        const from = $("#favoriteFrom").value.trim();
        const to = $("#favoriteTo").value.trim();
        const type = $("#favoriteType").value;
        if (!from || !to) { toast("출발지와 도착지를 입력해 주세요."); return; }
        if (from === to) { toast("출발지와 도착지를 다르게 입력해 주세요."); return; }
        if (state.favorites.some(route => route.from === from && route.to === to && route.type === type)) { toast("이미 즐겨찾기에 등록된 경로입니다."); return; }
        state.favorites.push({ from, to, type });
        persist();
        renderProfile();
        toast("즐겨찾는 경로를 추가했습니다.");
      } else if (action === "remove-favorite") {
        state.favorites.splice(Number(button.dataset.index), 1);
        persist();
        renderProfile();
        toast("즐겨찾기를 삭제했습니다.");
      }
    }
    document.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.nav) {
        const destination = button.dataset.nav;
        if (destination === "train" || destination === "bus") startSearch(destination);
        else if (destination === "taxi") {
          state.taxi.stage = "form";
          showPage("taxi");
        } else showPage(destination);
        return;
      }
      if (button.dataset.action) handleAction(button);
    });
    document.addEventListener("input", event => {
      if (event.target.id === "taxiFrom" || event.target.id === "taxiTo") {
        state.taxi[event.target.id === "taxiFrom" ? "from" : "to"] = event.target.value;
        const quoteElement = $("#taxiQuote");
        const button = $("#taxiCallButton");
        if (quoteElement) {
          const quote = taxiQuote(state.taxi.from, state.taxi.to, state.taxi.vehicle);
          quoteElement.innerHTML = `<span>예상 이동 ${quote.duration}분</span><strong>약 ${won(quote.fare)}</strong>`;
        }
        if (button) button.disabled = !state.taxi.from.trim() || !state.taxi.to.trim();
      }
      if (event.target.id === "homeFrom" || event.target.id === "searchFrom") state.draft.from = event.target.value;
      if (event.target.id === "homeTo" || event.target.id === "searchTo") state.draft.to = event.target.value;
      if (event.target.id === "homeDate" || event.target.id === "searchDate") state.draft.date = event.target.value;
    });
    readStoredState();
    $("#stationOptions").innerHTML = stations.map(item => `<option value="${escapeHtml(item)}"></option>`).join("");
    render();
  </script>
</body>
</html>
