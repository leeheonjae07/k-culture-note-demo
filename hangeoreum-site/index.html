<style>
:root{--blue:#1769e8;--navy:#102b52;--ink:#172235;--muted:#64748b;--line:#e5eaf1;--bg:#f4f7fb;--green:#16834a;--orange:#d86b16;--shadow:0 14px 40px rgba(25,55,95,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;font-size:17px}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:var(--navy)}.logo{width:40px;height:40px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:900}.top small{color:var(--muted);font-size:13px}.wrap{max-width:1120px;margin:28px auto;padding:0 22px 60px}.hero{background:linear-gradient(120deg,#123c78,#1769e8);color:white;border-radius:26px;padding:30px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(25px,4vw,36px);margin:0 0 10px}.hero p{margin:0;color:#e3efff;line-height:1.6}.hero-mark{font-size:58px;opacity:.95}.modebar{display:flex;gap:10px;background:#e8edf5;border-radius:18px;padding:7px;margin:24px 0}.mode{flex:1;min-height:58px;border-radius:13px;background:transparent;color:#526174;font-weight:800}.mode.active.practice{background:var(--green);color:white;box-shadow:0 5px 14px #16834a33}.mode.active.real{background:#e77720;color:white;box-shadow:0 5px 14px #e7772033}.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 14px;gap:12px}.section-head h2{font-size:23px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tile{background:white;border:1px solid var(--line);border-radius:22px;padding:23px;min-height:150px;text-align:left;box-shadow:0 5px 18px #1a35500a;transition:.18s}.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.tile .emoji{font-size:32px}.tile h3{font-size:21px;margin:13px 0 5px}.tile p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}.tile .arrow{float:right;color:var(--blue);font-size:24px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 5px 18px #1a35500a}.notice{margin-top:17px;background:#eef5ff;border:1px solid #d8e7ff;color:#214b81;border-radius:16px;padding:15px 18px;font-size:14px;line-height:1.6}.notice.green{background:#eaf7ef;border-color:#d1efdc;color:#17633b}.notice.orange{background:#fff4e9;border-color:#ffe0c2;color:#8a4915}.screen{display:none}.screen.show{display:block}.back{background:#eaf0f8;color:#28415f;border-radius:12px;padding:12px 16px;font-weight:800;margin-bottom:16px}.screen-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}.screen-title h2{margin:0;font-size:25px}.screen-title p{margin:5px 0 0;color:var(--muted);font-size:14px}.steps{display:flex;gap:7px;margin:15px 0 22px}.step{height:7px;border-radius:10px;background:#e6ebf2;flex:1}.step.done{background:var(--blue)}.bigbtn{width:100%;min-height:64px;padding:15px 18px;border-radius:15px;background:var(--blue);color:white;font-weight:900;font-size:19px;margin-top:10px}.bigbtn.green{background:var(--green)}.bigbtn.orange{background:var(--orange)}.bigbtn.light{background:#edf3fb;color:#244264}.choice-list{display:grid;gap:11px}.choice{width:100%;border:2px solid var(--line);background:white;border-radius:16px;padding:18px;text-align:left;font-weight:800;display:flex;justify-content:space-between;align-items:center;min-height:66px}.choice.selected{border-color:var(--blue);background:#f0f6ff}.choice span:last-child{color:var(--muted);font-weight:500;font-size:14px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-weight:800;font-size:15px}.field input,.field select{width:100%;padding:16px;border:2px solid var(--line);border-radius:13px;background:white;color:var(--ink);min-height:56px}.kiosk{max-width:560px;margin:0 auto;background:#f7f8fa;border:8px solid #26364c;border-radius:26px;padding:20px;box-shadow:var(--shadow)}.kiosk-head{text-align:center;background:#fff;border-radius:15px;padding:14px;margin-bottom:15px}.kiosk-head strong{font-size:22px}.kiosk-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.menu-item{background:#fff;border:2px solid #e1e6ed;border-radius:15px;padding:15px 8px;min-height:120px;font-weight:800}.menu-item .food{font-size:31px;display:block;margin-bottom:8px}.menu-item.selected{border-color:var(--green);background:#eaf7ef}.cart{background:white;border-radius:15px;padding:16px;margin-top:14px}.cartline{display:flex;justify-content:space-between;align-items:center;gap:10px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:44px;height:44px;border-radius:11px;background:#eaf0f8;font-weight:900}.kiosk-actions{display:flex;gap:10px;margin-top:12px}.kiosk-actions button{flex:1}.ticket{border:2px dashed #9cb4d2;border-radius:18px;padding:22px;text-align:center;background:#f8fbff}.ticket .check{font-size:48px}.ticket h3{font-size:24px;margin:8px}.ticket p{color:var(--muted);line-height:1.6}.small{font-size:13px;color:var(--muted)}.access{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:20px}.access button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;width:max-content;max-width:calc(100vw - 24px);transform:translateX(-50%);background:#172235;color:white;padding:13px 20px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:20;text-align:center}.toast.show{display:block;animation:pop .2s}@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}footer{text-align:center;color:#7a8798;font-size:13px;margin-top:28px}
@media(max-width:650px){.wrap{padding:0 14px 40px;margin:18px auto}.hero{padding:24px 20px}.hero-mark{font-size:42px}.grid{grid-template-columns:1fr}.modebar{position:sticky;top:70px;z-index:5}.mode{font-size:15px;min-height:55px}.formrow{grid-template-columns:1fr}.panel{padding:17px}.top{padding:12px 15px}}

/* Mobile-first touch and safe-area refinements */
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ overscroll-behavior-y:contain; }
button,.choice,.tile,.menu-item{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
@media(max-width:650px){
  body{font-size:18px}
  .wrap{padding-left:12px;padding-right:12px;padding-bottom:calc(34px + env(safe-area-inset-bottom))}
  .top{padding-top:calc(10px + env(safe-area-inset-top))}
  .hero{border-radius:20px;padding:22px 18px}
  .hero h1{font-size:27px;line-height:1.25}
  .hero p{font-size:15px}
  .modebar{top:calc(62px + env(safe-area-inset-top));margin-top:17px}
  .mode{min-width:0;padding:8px 5px;font-size:14px;line-height:1.35}
  .tile{min-height:132px;padding:19px}
  .tile h3{font-size:20px}
  .panel{border-radius:19px;padding:16px}
  .kiosk{border-width:5px;border-radius:21px;padding:13px}
  .menu-item{min-height:112px;padding:12px 5px}
  .bigbtn{min-height:68px;font-size:18px}
  .choice{min-height:70px;padding:15px 13px}
  .field input,.field select{font-size:16px;min-height:58px}
  .back{min-height:48px}
}
@media(max-width:380px){
  .brand{font-size:19px}
  .top small{font-size:11px}
  .hero-mark{font-size:34px}

  .menu-grid{gap:8px}
}

  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

</head>
<body>
<header><div class="top"><div class="brand"><div class="logo">한</div>한걸음</div><small>누구나 쉽게, 한 단계씩</small></div></header>
<main class="wrap">
<section id="home" class="screen show">
 <div class="hero"><div><h1>천천히 해도 괜찮아요.</h1><p>먼저 연습하고, 익숙해지면 실제 예약까지.<br>큰 버튼으로 쉽고 안전하게 이용해 보세요.</p></div><div class="hero-mark">☝️</div></div>
 <div class="modebar"><button class="mode active practice" id="practiceMode" onclick="setMode('practice')">연습 모드 · 결제되지 않아요</button><button class="mode real" id="realMode" onclick="setMode('real')">실전 예약 모드</button></div>
 <div class="section-head"><div><h2 id="homeTitle">무엇을 연습할까요?</h2><p id="homeDesc">실제 돈이 나가지 않는 가상 환경입니다.</p></div></div>
 <div class="grid" id="homeTiles"></div>
 <div class="notice" id="modeNotice">안심하세요. 연습 모드에서는 실제 결제나 예약이 발생하지 않습니다.</div>
 <div class="access"><strong>화면 설정</strong><button onclick="fontChange(1)">글씨 크게 +</button><button onclick="fontChange(-1)">글씨 작게 −</button><button onclick="speak('한걸음 앱입니다. 원하는 서비스를 큰 버튼으로 선택하세요.')">음성 안내 듣기</button></div>
</section>
<section id="flow" class="screen">
 <button class="back" onclick="goHome()">← 처음 화면</button>
 <div class="screen-title"><div><h2 id="flowTitle">서비스</h2><p id="flowSubtitle">화면 안내에 따라 진행하세요.</p></div></div>
 <div class="steps" id="steps"></div>
 <div id="flowBody"></div>
</section>
<footer>한걸음 · 사용자 맞춤형 예약 및 키오스크 연습 프로토타입<br>※ 실전 예약 화면은 과제 시연용 모의 화면이며 실제 외부 예약·결제 API와 연결되어 있지 않습니다.</footer>
</main>
<div class="toast" id="toast"></div>
<script>
let mode='practice', current=null, step=0, state={}, fontSize=17;
const $=id=>document.getElementById(id);
function setMode(m){mode=m;$('practiceMode').classList.toggle('active',m==='practice');$('realMode').classList.toggle('active',m==='real');$('practiceMode').classList.toggle('practice',true);$('realMode').classList.toggle('real',true);$('homeTitle').textContent=m==='practice'?'무엇을 연습할까요?':'어떤 서비스를 예약할까요?';$('homeDesc').textContent=m==='practice'?'실제 돈이 나가지 않는 가상 환경입니다.':'예약 과정을 미리 확인하는 시연용 화면입니다.';$('modeNotice').className='notice '+(m==='practice'?'green':'orange');$('modeNotice').textContent=m==='practice'?'안심하세요. 연습 모드에서는 실제 결제나 예약이 발생하지 않습니다.':'실전 예약 시연 화면입니다. 현재 실제 결제 및 외부 예약은 연결되어 있지 않습니다.';renderTiles()}
function renderTiles(){let items=mode==='practice'?[['🧾','식당 키오스크 연습','메뉴 선택부터 가상 결제까지 연습','food'],['🚆','교통 발권기 연습','기차·버스 승차권 발권 연습','transport']]:[['🍽️','식당 예약','지역과 날짜, 인원을 선택하는 과정','restaurant'],['🚍','교통 예매','출발지와 목적지를 입력하는 과정','traffic']];$('homeTiles').innerHTML=items.map(x=>`<button class="tile" onclick="start('${x[3]}')"><span class="arrow">→</span><span class="emoji">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}
function goHome(){$('flow').classList.remove('show');$('home').classList.add('show');current=null;renderTiles()}
function start(type){current=type;step=0;state={qty:1};$('home').classList.remove('show');$('flow').classList.add('show');renderFlow()}
function setStep(n){step=n;renderFlow()}
function renderFlow(){$('flowTitle').textContent=({food:'식당 키오스크 연습',transport:'교통 발권기 연습',restaurant:'식당 예약',traffic:'교통 예매'})[current];$('flowSubtitle').textContent=mode==='practice'?'연습은 언제든 처음부터 다시 할 수 있습니다.':'큰 글씨 안내에 따라 항목을 선택하세요.';let total=current==='food'?3:current==='transport'?3:3;$('steps').innerHTML=Array.from({length:total},(_,i)=>`<div class="step ${i<=step?'done':''}"></div>`).join('');if(current==='food')foodFlow();if(current==='transport')transportFlow();if(current==='restaurant')restaurantFlow();if(current==='traffic')trafficFlow()}
function foodFlow(){let b=$('flowBody');if(step===0){b.innerHTML=`<div class="kiosk"><div class="kiosk-head"><strong>🍴 행복한 식당</strong><p>주문하실 메뉴를 선택해 주세요.</p></div><div class="menu-grid">${[['🍔','불고기 버거','7,000원'],['🍜','잔치국수','6,000원'],['🍚','비빔밥','8,000원'],['🥗','샐러드','7,500원']].map((x,i)=>`<button class="menu-item ${state.item===i?'selected':''}" onclick="state.item=${i};renderFlow()"><span class="food">${x[0]}</span>${x[1]}<br><span class="small">${x[2]}</span></button>`).join('')}</div><button class="bigbtn green" onclick="if(state.item===undefined){toast('메뉴를 먼저 선택해 주세요.');return}setStep(1)">선택 완료 · 다음</button></div><div class="notice green">연습 모드: 어떤 메뉴를 선택해도 실제 주문은 접수되지 않습니다.</div>`}else if(step===1){let names=['불고기 버거','잔치국수','비빔밥','샐러드'],prices=[7000,6000,8000,7500];b.innerHTML=`<div class="kiosk"><div class="kiosk-head"><strong>주문 내용을 확인해 주세요</strong><p>수량을 조절할 수 있습니다.</p></div><div class="cart"><div class="cartline"><strong>${names[state.item]}</strong><strong>${prices[state.item].toLocaleString()}원</strong></div><hr style="border:0;border-top:1px solid #e5eaf1;margin:15px 0"><div class="cartline"><span>수량</span><div class="qty"><button onclick="state.qty=Math.max(1,state.qty-1);renderFlow()">−</button><strong>${state.qty}</strong><button onclick="state.qty++;renderFlow()">+</button></div></div><hr style="border:0;border-top:1px solid #e5eaf1;margin:15px 0"><div class="cartline"><strong>합계</strong><strong>${(prices[state.item]*state.qty).toLocaleString()}원</strong></div></div><button class="bigbtn green" onclick="setStep(2)">주문 내용 확인</button><button class="bigbtn light" onclick="setStep(0)">메뉴 다시 선택</button></div>`}else{b.innerHTML=`<div class="kiosk"><div class="kiosk-head"><strong>결제 단계 연습</strong><p>실제 결제는 절대 진행되지 않습니다.</p></div><div class="ticket"><div class="check">✓</div><h3>가상 주문 완료!</h3><p>주문 과정을 성공적으로 연습했습니다.<br>실제 돈은 결제되지 않았습니다.</p></div><button class="bigbtn green" onclick="toast('연습을 완료했습니다. 잘하셨어요!')">연습 완료</button><button class="bigbtn light" onclick="step=0;state={qty:1};renderFlow()">처음부터 다시 연습</button></div>`}}
function transportFlow(){let b=$('flowBody');if(step===0){b.innerHTML=`<div class="panel"><h3>어떤 승차권을 발권할까요?</h3><div class="choice-list">${[['🚄','기차 승차권','KTX · 일반열차'],['🚌','시외버스 승차권','시외·고속버스']].map((x,i)=>`<button class="choice ${state.kind===i?'selected':''}" onclick="state.kind=${i};renderFlow()"><span>${x[0]}　${x[1]}</span><span>${x[2]}</span></button>`).join('')}</div><button class="bigbtn green" onclick="if(state.kind===undefined){toast('교통수단을 선택해 주세요.');return}setStep(1)">다음</button></div><div class="notice green">실제 발권기가 아닌 연습용 화면입니다.</div>`}else if(step===1){b.innerHTML=`<div class="panel"><h3>승차 정보를 입력해 주세요.</h3><div class="field"><label>출발역 / 터미널</label><select id="from"><option>수원</option><option>서울</option><option>대전</option></select></div><div class="field"><label>도착역 / 터미널</label><select id="to"><option>부산</option><option>대전</option><option>서울</option></select></div><div class="field"><label>승차 인원</label><select id="people"><option>어른 1명</option><option>어른 2명</option><option>어른 1명, 어린이 1명</option></select></div><button class="bigbtn green" onclick="state.from=$('from').value;state.to=$('to').value;state.people=$('people').value;setStep(2)">선택 완료</button><button class="bigbtn light" onclick="setStep(0)">이전</button></div>`}else{b.innerHTML=`<div class="panel"><div class="ticket"><div class="check">🎫</div><h3>발권 연습 완료</h3><p>${state.from||'수원'} → ${state.to||'부산'}<br>${state.people||'어른 1명'}<br><br>가상 승차권입니다. 실제 표가 발권되지 않았습니다.</p></div><button class="bigbtn green" onclick="toast('교통 발권 연습을 완료했습니다.')">완료</button><button class="bigbtn light" onclick="step=0;state={};renderFlow()">다시 연습</button></div>`}}
function restaurantFlow(){let b=$('flowBody');if(step===0){b.innerHTML=`<div class="panel"><h3>식당 예약 정보를 선택해 주세요.</h3><div class="field"><label>지역</label><select id="area"><option>수원시</option><option>서울특별시</option><option>화성시</option></select></div><div class="field"><label>방문 날짜</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="formrow"><div class="field"><label>방문 시간</label><select id="time"><option>12:00</option><option>13:00</option><option>18:00</option><option>19:00</option></select></div><div class="field"><label>방문 인원</label><select id="count"><option>2명</option><option>1명</option><option>3명</option><option>4명</option></select></div></div><button class="bigbtn orange" onclick="state.area=$('area').value;state.date=$('date').value;state.time=$('time').value;state.count=$('count').value;setStep(1)">예약 정보 확인</button></div>`}else if(step===1){b.innerHTML=`<div class="panel"><h3>예약 정보를 확인해 주세요.</h3><div class="ticket"><h3>🍽️ 방문 예약</h3><p>${state.area}<br>${state.date} · ${state.time}<br>${state.count}</p></div><div class="notice orange">시연용 예약입니다. 실제 식당에 예약이 전달되지 않습니다.</div><button class="bigbtn orange" onclick="setStep(2)">모의 예약 확정</button><button class="bigbtn light" onclick="setStep(0)">수정하기</button></div>`}else{b.innerHTML=`<div class="panel"><div class="ticket"><div class="check">✓</div><h3>모의 예약이 완료되었습니다.</h3><p>${state.area} · ${state.date}<br>${state.time} · ${state.count}<br>예약번호: DEMO-2026-001</p></div><button class="bigbtn orange" onclick="toast('예약 과정을 완료했습니다.')">확인</button><button class="bigbtn light" onclick="goHome()">홈으로</button></div>`}}
function trafficFlow(){let b=$('flowBody');if(step===0){b.innerHTML=`<div class="panel"><h3>이동 정보를 입력해 주세요.</h3><div class="field"><label>출발지</label><input id="from" placeholder="예: 수원"></div><div class="field"><label>도착지</label><input id="to" placeholder="예: 서울"></div><div class="field"><label>이동 수단</label><select id="kind"><option>시외버스</option><option>기차</option></select></div><button class="bigbtn orange" onclick="state.from=$('from').value||'수원';state.to=$('to').value||'서울';state.kind=$('kind').value;setStep(1)">다음</button></div>`}else if(step===1){b.innerHTML=`<div class="panel"><h3>예매 정보를 확인해 주세요.</h3><div class="ticket"><div style="font-size:32px">🚆</div><h3>${state.from} → ${state.to}</h3><p>${state.kind} · 성인 1명<br>시연용 임의 운임: 12,000원</p></div><div class="notice orange">실제 운행 정보 및 결제 시스템과 연결되지 않은 시연 데이터입니다.</div><button class="bigbtn orange" onclick="setStep(2)">모의 예매 확정</button><button class="bigbtn light" onclick="setStep(0)">수정하기</button></div>`}else{b.innerHTML=`<div class="panel"><div class="ticket"><div class="check">✓</div><h3>모의 예매 완료</h3><p>${state.from} → ${state.to}<br>${state.kind} · 성인 1명<br>가상 승차권 번호: DEMO-TICKET-01</p></div><button class="bigbtn orange" onclick="goHome()">홈으로</button></div>`}}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function fontChange(d){fontSize=Math.max(15,Math.min(22,fontSize+d));document.body.style.fontSize=fontSize+'px';toast('글씨 크기를 조절했습니다.')}
function speak(msg){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(msg))}else toast(msg)}
renderTiles();
</script>
</body></html>
